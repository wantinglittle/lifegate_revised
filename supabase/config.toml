# The public submit-group Edge Function accepts unauthenticated browser form
# submissions. reCAPTCHA, CORS, validation, and server-side credentials protect
# the endpoint; callers do not need to be signed in to Supabase.
[functions.submit-group]
verify_jwt = false

[functions.send-dashboard-message]
verify_jwt = false

[functions.submit-collective]
verify_jwt = false

[functions.contact-collective-hosts]
verify_jwt = false

[functions.update-collective]
verify_jwt = false
