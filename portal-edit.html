<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Community | LifeGate Community Portal</title>
  <link rel="icon" href="images/favicon-grey.png" type="image/png">
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="portal.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="wrapper portal-wrapper">
    <header class="portal-header">
      <div class="header-logo">
        <a href="index.html"><img src="images/lg_logo.svg" alt="LIFEGATE Church" height="40"></a>
      </div>
      <div class="header-content">
        <h1>LifeGate Community Portal</h1>
        <p>Community details</p>
      </div>
      <div class="header-actions">
        <a href="portal.html" class="add-group-btn">Back to Portal</a>
      </div>
    </header>

    <main class="portal-main">
      <section class="portal-card portal-login-card" aria-labelledby="portal-edit-title">
        <h2 id="portal-edit-title">Edit Community</h2>
        <p id="portal-edit-community" class="portal-muted" aria-live="polite">Loading community...</p>
        <p>Editing tools are coming in the next phase.</p>
        <a class="portal-secondary-link" href="portal.html">Back to Portal</a>
        <p id="portal-edit-status" class="portal-status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script type="module" src="portal-edit.js"></script>
</body>
</html>
